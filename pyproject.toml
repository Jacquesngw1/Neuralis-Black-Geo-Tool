[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralis-black-geo-tool"
dynamic = ["version"]
description = "A geospatial intelligence and analysis toolkit with neural-network-based enrichment."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Jacquesngw1"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.31.0",
    "folium>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "build",
]

[project.scripts]
neuralis = "neuralis.cli:main"

[tool.setuptools.dynamic]
version = {attr = "neuralis.__version__"}

[tool.setuptools.packages.find]
include = ["neuralis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
